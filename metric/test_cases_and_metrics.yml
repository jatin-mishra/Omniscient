feature: policy_engine (Policy, UserPermission; Permission is an enum in code only)
approved: 2026-11-01 (edits: directory/document/panel existence not verified yet; DB owns uniqueness)

success_metrics:
  - make lint, make typecheck, make test pass; onboarding tests pass unchanged
  - make test-integration passes against docker-compose Postgres
  - every case below is covered by a test referencing its id
  - test_module_boundaries passes (policy_engine imports no other business module)

failure_metrics:
  - any policy_engine endpoint returns 500 for a client-caused condition
  - internal BIGINT id appears in any response body
  - a PATCH changes any field other than status

test_cases:
  happy_paths:
    - {id: HP-1, scenario: "POST /policies -> 201, UUID id, ACTIVE, created_by == X-User-Id"}
    - {id: HP-2, scenario: "PATCH /policies/{id} status INACTIVE -> 200, updated_by set"}
    - {id: HP-3, scenario: "POST /user-permissions team:update + ALL -> 201"}
    - {id: HP-4, scenario: "POST /user-permissions directory:read + directory id -> 201 (unverified)"}
    - {id: HP-5, scenario: "PATCH /user-permissions/{id} status INACTIVE -> 200"}
  auth_header:
    - {id: A1, scenario: "missing X-User-Id -> 401 envelope"}
    - {id: A2, scenario: "non-UUID X-User-Id -> 401"}
  policy:
    - {id: P1, scenario: "permission_name not in enum -> 422"}
    - {id: P2, scenario: "effect not ALLOW/DENY -> 422"}
    - {id: P3, scenario: "duplicate (permission_name, effect) -> 409 (DB unique constraint)"}
    - {id: P4, scenario: "unknown field in POST or PATCH -> 422"}
    - {id: P5, scenario: "PATCH with anything besides status -> 422"}
    - {id: P6, scenario: "PATCH status null or missing -> 422"}
    - {id: P7, scenario: "PATCH unknown id -> 404"}
    - {id: P8, scenario: "PATCH invalid status value -> 422"}
    - {id: P9, scenario: "deactivate policy with ACTIVE user-permissions -> 409"}
    - {id: P10, scenario: "set ACTIVE on an ACTIVE policy -> 200 (idempotent)"}
  resource_rules:
    - {id: R1, scenario: "resource_id ALL with resource_type != ALL -> 422"}
    - {id: R2, scenario: "UUID resource_id with resource_type ALL -> 422"}
    - {id: R3, scenario: "resource_id neither ALL nor UUID -> 422"}
    - {id: R4, scenario: "user:update scoped to a specific id -> 422 (ALL only)"}
    - {id: R5, scenario: "team:create / team:add_user scoped to an id -> 422"}
    - {id: R6, scenario: "directory:read accepts team and directory scope"}
    - {id: R7, scenario: "directory:create with directory scope -> 422 (ALL/team only)"}
    - {id: R8, scenario: "document:delete accepts team, directory and document scope"}
    - {id: R9, scenario: "team:update with document resource_type -> 422"}
    - {id: R10, scenario: "entity_type outside team/group/user -> 422"}
    - {id: R11, scenario: "lowercase 'all' -> 422"}
  existence_and_state:
    - {id: E1, scenario: "unknown policy_id -> 404"}
    - {id: E2, scenario: "INACTIVE policy -> 409"}
    - {id: E3, scenario: "unknown entity_id for team, group, user -> 404 each"}
    - {id: E4, scenario: "unknown team resource_id -> 404"}
    - {id: E5, scenario: "resource ALL -> no resource existence check"}
    - {id: E6, scenario: "directory / document / panel ids are not verified, accepted as UUIDs"}
    - {id: E7, scenario: "duplicate grant -> 409 (DB unique constraint, IntegrityError caught)"}
    - {id: E8, scenario: "activate user-permission whose policy is INACTIVE -> 409"}
    - {id: E9, scenario: "PATCH unknown user-permission -> 404"}
    - {id: E10, scenario: "same entity+policy, different resource -> allowed"}
  integration:
    - {id: I1, scenario: "tables created at startup; unique constraints enforced by Postgres"}
    - {id: I2, scenario: "end to end: team -> policy -> user-permission -> deactivate"}
    - {id: I3, scenario: "concurrent duplicate POST -> one 201, one 409, never 500"}
  boundary_and_regression:
    - {id: B1, scenario: "policy_engine imports no other business module"}
    - {id: B2, scenario: "onboarding Status values and behaviour unchanged"}

