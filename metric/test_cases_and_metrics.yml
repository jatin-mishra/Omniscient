feature: onboarding CRUD (Team, User, Group, GroupUser) + per-module app layout
approved: 2026-11-01

success_metrics:
  - make lint, make typecheck (mypy --strict), make test all pass
  - make test-integration passes against docker-compose Postgres + ES
  - every case below is covered by at least one test (id referenced in the test comment)
  - existing endpoints (/health, /health/ready) unchanged (retrieval's old /v1/documents, /v1/query, /v1/search were removed by the retrieval spec below)

failure_metrics:
  - any onboarding endpoint returns 500 for a client-caused condition
  - internal BIGINT id appears in any response body
  - a business module imports another business module

test_cases:
  happy_paths:
    - id: HP-1
      scenario: create each resource -> 201, UUID `id`, status ACTIVE
    - id: HP-2
      scenario: GET /{id} returns the same body as create
    - id: HP-3
      scenario: PATCH of one field changes only that field
    - id: HP-4
      scenario: empty PATCH body -> 200, nothing changes (idempotent)
    - id: HP-5
      scenario: response never contains the internal BIGINT id

  not_found_and_validation:
    - id: 1
      scenario: GET / PATCH unknown UUID -> 404 envelope with request_id echoed
    - id: 2
      scenario: malformed UUID, blank name, bad email, unknown status, explicit null on required field -> 422
    - id: 3
      scenario: unknown body field -> 422 (extra=forbid), typos never silently ignored

  teams:
    - id: 4
      scenario: duplicate name, also differing only by case -> 409
    - id: 5
      scenario: manager_id unknown -> 404; manager INACTIVE -> 409
    - id: 6
      scenario: deactivate team with ACTIVE users -> 409; with only INACTIVE users -> 200
    - id: 7
      scenario: clear manager with manager_id null -> 200
    - id: B
      scenario: reactivate team whose manager is INACTIVE -> 409, unless same PATCH sets an ACTIVE manager or clears it

  users:
    - id: 8
      scenario: duplicate email, also differing only by case -> 409
    - id: 9
      scenario: team_id unknown -> 404; team INACTIVE -> 409 (create and move)
    - id: 10
      scenario: deactivate user who manages an ACTIVE team -> 409
    - id: 11
      scenario: email in PATCH -> 422 (immutable identity key)
    - id: A
      scenario: reactivate user whose team is INACTIVE -> 409, unless same PATCH moves them to an ACTIVE team

  groups:
    - id: 12
      scenario: duplicate name, also differing only by case -> 409; deactivating a group always allowed

  group_users:
    - id: 13
      scenario: group or user unknown -> 404; group or user INACTIVE -> 409
    - id: 14
      scenario: duplicate (group, user) pair -> 409 even when existing membership is INACTIVE
    - id: 15
      scenario: reactivate membership whose group or user is now INACTIVE -> 409

  integrity_integration:
    - id: 16
      scenario: two concurrent creates with the same unique name -> one 201, one 409, never 500
    - id: 17
      scenario: a failed request leaves no partial rows (rollback)
    - id: 18
      scenario: updated_at changes on PATCH, created_at does not
    - id: 19
      scenario: existing suite passes with only import-path changes (no assertion changes)
    - id: 20
      scenario: import-boundary test fails if a business module imports another business module

