feature: retrieval - Temporal integration (trigger workflow + logging activity, separate worker) and ChunkVector (pgvector) with add-vector API
approved: PENDING REVIEW (no code written until approved; assumptions to confirm are marked ASSUMPTION)

success_metrics:
  - make lint, make typecheck (mypy --strict), make test all pass
  - make test-integration passes against docker-compose pgvector Postgres + Temporal (or reported honestly as not run)
  - every case below is covered by at least one test (id referenced in the test comment)
  - existing onboarding, policy_engine and retrieval tests unchanged and green; /health unchanged

failure_metrics:
  - any new endpoint returns 500 for a client-caused or Temporal-down condition
  - app fails to start when Temporal is unreachable
  - internal BIGINT id appears in any response body
  - retrieval imports another business module
  - vector length written to Postgres differs from EMBEDDING_DIMENSIONS

test_cases:
  config:
    - {id: T1, scenario: "all Temporal settings (address, namespace, api key, tls, task queue, connect/rpc/workflow timeouts) and embedding_dimensions load from env with documented defaults"}
    - {id: T2, scenario: "non-positive timeout or dimension in env -> settings validation error at startup"}
    - {id: T3, scenario: "empty api key -> client built without auth; tls flag honored"}
  client_lifecycle:
    - {id: L1, scenario: "app boots with Temporal unreachable (lazy connect); no exception at startup"}
    - {id: L2, scenario: "client created once in lifespan, stored on app.state, closed on shutdown"}
    - {id: L3, scenario: "get_temporal_client dependency returns the app.state client; overridable in tests"}
    - {id: L4, scenario: "/health/ready reports Temporal status; Temporal down -> not ready entry, /health liveness unaffected"}
  trigger_workflow:
    - {id: W1, scenario: "POST /v1/workflows/log with message -> 202 Accepted, body has workflow_id, workflow started on configured task queue with execution timeout"}
    - {id: W2, scenario: "missing or non-UUID X-User-Id -> 401, service never called"}
    - {id: W3, scenario: "blank message / unknown body field -> 422, service never called"}
    - {id: W4, scenario: "Temporal unreachable or start fails -> 503 workflow_unavailable, not 500"}
    - {id: W5, scenario: "two triggers produce two distinct workflow_ids (no collision)"}
    - {id: W6, scenario: "very long message (> max length, ASSUMPTION 1000) -> 422"}
  worker_and_activity:
    - {id: K1, scenario: "LogWorkflow executes log_activity exactly once and the activity logs the message with workflow_id"}
    - {id: K2, scenario: "worker connects using the same settings, registers workflow + activity on the task queue, shuts down gracefully on SIGINT/SIGTERM"}
    - {id: K3, scenario: "workflow code is deterministic: no I/O or logging in workflow body, only in the activity"}
  embedding_provider:
    - {id: E1, scenario: "EmbeddingProvider is a Protocol; ConstantEmbeddingProvider returns a vector of length EMBEDDING_DIMENSIONS with constant values"}
    - {id: E2, scenario: "same input twice -> identical vector (deterministic stub)"}
    - {id: E3, scenario: "factory returns the stub for the default provider name; unknown provider -> InvalidRequestError (422) or startup error (ASSUMPTION: error at wiring time)"}
  chunk_vector_add:
    - {id: V1, scenario: "POST /v1/chunk-vectors with chunk_id, document_id, content -> 201, ACTIVE, created_by = updated_by = actor, response has no raw BIGINT id and does not echo the full vector (ASSUMPTION: omit vector from response)"}
    - {id: V2, scenario: "service calls the embedding provider once with the content and stores its vector in Postgres"}
    - {id: V3, scenario: "missing or non-UUID X-User-Id -> 401, service never called"}
    - {id: V4, scenario: "blank chunk_id / blank content / non-UUID document_id / unknown body field -> 422, service never called"}
    - {id: V5, scenario: "client cannot set status, created_by, updated_by or vector on create -> 422"}
    - {id: V6, scenario: "unknown document_id -> 404 (ASSUMPTION: document existence is checked in Postgres; chunk existence in ES is NOT checked)"}
    - {id: V7, scenario: "INACTIVE document -> 409"}
    - {id: V8, scenario: "duplicate chunk_id -> 409 (ASSUMPTION: unique chunk_id; one vector per chunk), never 500"}
    - {id: V9, scenario: "provider returns wrong-length vector -> 500-class internal error is avoided: service rejects with a clear internal error and nothing is persisted"}
    - {id: V10, scenario: "embedding provider raises -> nothing persisted, session rolled back"}
    - {id: V11, scenario: "service owns commit; repository only flushes"}
  chunk_vector_model:
    - {id: M1, scenario: "ChunkVector uses IdMixin, TimestampMixin, AuditMixin and status_column(); defaults status ACTIVE"}
    - {id: M2, scenario: "set_status(status, actor) updates status and updated_by; invalid status rejected by type/CHECK"}
    - {id: M3, scenario: "setting the same status is idempotent"}
    - {id: M4, scenario: "no API for set_status in this prompt (model method only, unit-tested) - ASSUMPTION"}
  integration:
    - {id: I1, scenario: "startup creates the vector extension before create_all; chunk_vectors table exists with vector(EMBEDDING_DIMENSIONS) column; startup is idempotent on second boot"}
    - {id: I2, scenario: "end to end: create directory + document, POST chunk-vector, read the row back, vector equals the stub constant"}
    - {id: I3, scenario: "duplicate chunk_id enforced by Postgres unique constraint -> 409"}
    - {id: I4, scenario: "end to end: POST workflow with a running worker -> workflow completes and the activity log line is observed"}
    - {id: I5, scenario: "plain postgres image without pgvector -> clear startup error naming the missing extension"}
  boundary_and_regression:
    - {id: B1, scenario: "retrieval (including temporal/ subpackage) imports no other business module"}
    - {id: B2, scenario: "onboarding, policy_engine and existing retrieval behaviour unchanged"}
    - {id: B3, scenario: "existing tables unaffected by switching the postgres image to pgvector/pgvector:pg16"}

---
feature: tracker - Ticket (Postgres) with provider interface (INTERNAL now, Jira later), add + list APIs, status-update webhook (prompt-5)
approved: PENDING REVIEW (no code written until approved; assumptions to confirm are marked ASSUMPTION)

success_metrics:
  - make lint, make typecheck (mypy --strict), make test all pass
  - make test-integration passes against docker-compose Postgres (or reported honestly as not run)
  - every case below is covered by at least one test (id referenced in the test comment)
  - existing onboarding, policy_engine and retrieval tests unchanged and green
  - adding a provider requires only a new TicketProvider implementation + registry entry (no service/API change)

failure_metrics:
  - any new endpoint returns 500 for a client-caused or provider-failure condition
  - internal BIGINT id appears in any response body
  - webhook mutates a ticket without a valid signature
  - a stale (older) webhook event overwrites a newer status
  - tracker imports another business module
  - resolved_at inconsistent with status (set while open, or null while resolved/closed)

test_cases:
  config:
    - {id: C1, scenario: "TRACKER_WEBHOOK_SECRET and default provider load from env; secret defaults to empty"}
    - {id: C2, scenario: "empty secret -> every webhook rejected 401 (fail closed)"}
  model:
    - {id: M1, scenario: "Ticket uses IdMixin, TimestampMixin, AuditMixin; status defaults OPEN; enums stored as lowercase VARCHAR + CHECK"}
    - {id: M2, scenario: "UNIQUE(provider, external_ticket_id); two tickets may share a document_id"}
    - {id: M3, scenario: "set_status to RESOLVED/CLOSED sets resolved_at; to OPEN/IN_PROGRESS clears it (reopen); same status twice is a no-op; updated_by recorded"}
  provider_interface:
    - {id: P1, scenario: "TicketProvider is a Protocol: create_ticket(spec)->ExternalTicket, parse_status_event(headers, body)->StatusEvent"}
    - {id: P2, scenario: "InternalProvider generates a unique provider-side external_ticket_id (TKT-<short uuid>) per call and returns status OPEN"}
    - {id: P3, scenario: "registry returns InternalProvider for 'internal'; unknown provider name -> 422 (API path) / 404 for webhook path"}
    - {id: P4, scenario: "InternalProvider.parse_status_event maps {external_ticket_id, status} body to StatusEvent; invalid JSON / missing field / unknown status -> 422"}
    - {id: P5, scenario: "provider raising on create -> 502 ticket_provider_error, nothing persisted"}
  create_ticket:
    - {id: T1, scenario: "POST /v1/tickets valid body -> 201, status OPEN, provider internal, external_id UUID returned, created_by=updated_by=actor, no BIGINT id in body"}
    - {id: T2, scenario: "reporter_id omitted -> defaults to actor; assignee_id omitted -> null"}
    - {id: T3, scenario: "missing or non-UUID X-User-Id -> 401, service never called"}
    - {id: T4, scenario: "blank title, unknown document_type, non-UUID document_id, bad priority/type, unknown body field -> 422, service never called"}
    - {id: T5, scenario: "client cannot set status, resolved_at, external_ticket_id, created_by -> 422"}
    - {id: T6, scenario: "reporter or assignee user not found (verifier says False) -> 404; verifier returns None -> accepted unverified (same as policy_engine)"}
    - {id: T7, scenario: "due_at in the past -> accepted (confirmed); due_at naive datetime -> 422 (timezone required)"}
    - {id: T8, scenario: "service owns commit; repository only flushes; provider called before insert"}
    - {id: T9, scenario: "duplicate (provider, external_ticket_id) at commit -> 409, never 500"}
    - {id: T10, scenario: "title > 100 chars or description > 2000 chars -> 422; exactly 100 / 2000 accepted (confirmed limits)"}
  list_tickets:
    - {id: G1, scenario: "GET /v1/tickets?document_type=rca&document_id=<uuid> -> 200, tickets newest first, no BIGINT id"}
    - {id: G2, scenario: "no tickets for the document -> 200 with empty list"}
    - {id: G3, scenario: "other documents' tickets are not returned"}
    - {id: G4, scenario: "missing document_type or document_id, non-UUID document_id, unknown document_type -> 422"}
    - {id: G5, scenario: "missing or non-UUID X-User-Id -> 401, service never called (policy_engine check: PENDING user decision)"}
  webhook:
    - {id: W1, scenario: "valid signature + known ticket + new status -> 204, status updated, updated_by=SYSTEM_ACTOR"}
    - {id: W2, scenario: "move to RESOLVED/CLOSED -> resolved_at set; later reopen -> resolved_at cleared"}
    - {id: W3, scenario: "same status delivered twice -> 204 both times, row unchanged (idempotent retry)"}
    - {id: W4, scenario: "stale-event guard: event.occurred_at older than the last applied provider event -> 204, ticket unchanged; newer or equal-and-different applies; any status transition allowed (no state machine)"},
    {id: W13, scenario: "occurred_at missing or naive datetime -> 422; stored as ticket.last_event_at (extra column) so manual updated_at changes do not affect the guard"}
    - {id: W5, scenario: "missing or wrong X-Signature -> 401, ticket untouched"}
    - {id: W6, scenario: "signature computed over the exact raw body; altered body with old signature -> 401"}
    - {id: W7, scenario: "signature compared in constant time (hmac.compare_digest)"}
    - {id: W8, scenario: "unknown provider path segment -> 404"}
    - {id: W9, scenario: "valid signature but unknown external_ticket_id -> 404"}
    - {id: W10, scenario: "valid signature, malformed payload -> 422"}
    - {id: W11, scenario: "webhook needs no X-User-Id header"}
    - {id: W12, scenario: "ticket of provider A not matched by external id from provider B"}
  integration:
    - {id: I1, scenario: "startup creates tickets table with unique + document index; idempotent on second boot"}
    - {id: I2, scenario: "end to end: create ticket, list by document, webhook RESOLVED, list shows status + resolved_at"}
    - {id: I3, scenario: "unique (provider, external_ticket_id) enforced by Postgres"}
  boundary_and_regression:
    - {id: B1, scenario: "tracker imports no other business module (existing boundary test)"}
    - {id: B2, scenario: "onboarding, policy_engine, retrieval behaviour and tests unchanged"}
