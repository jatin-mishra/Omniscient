feature: retrieval (Directory + Document in Postgres, Chunk in Elasticsearch); old retrieval APIs removed
approved: 2026-11-01 (plan approved; upload is metadata-only, storage providers are empty stubs; chunk update is a simple overwrite)

success_metrics:
  - make lint, make typecheck (mypy --strict), make test all pass
  - make test-integration passes against docker-compose Postgres + ES
  - every case below is covered by at least one test (id referenced in the test comment)
  - /health and /health/ready unchanged; onboarding and policy_engine tests unchanged and green

failure_metrics:
  - any retrieval endpoint returns 500 for a client-caused condition
  - internal BIGINT id appears in any response body
  - retrieval imports another business module
  - a PATCH changes any field that has no setter in the spec

test_cases:
  removed_apis:
    - {id: X1, scenario: "POST /v1/documents (old shape), /v1/query, /v1/search -> 404/405; old routers and rag stubs gone"}
  happy_paths:
    - {id: HP-1, scenario: "create root directory -> 201, UUID id, ACTIVE, created_by = updated_by = actor"}
    - {id: HP-2, scenario: "create child directory under an existing parent -> 201, parent_id echoed as the parent's UUID"}
    - {id: HP-3, scenario: "PATCH directory name / parent_id / status each changes only that field and sets updated_by"}
    - {id: HP-4, scenario: "create document -> 201, upload_status INITIATED, status ACTIVE, version 1, etag/raw_storage_url null"}
    - {id: HP-5, scenario: "PATCH document name / directory_id / etag / raw_storage_url / upload_status / status each applied, version +1, updated_by set"}
    - {id: HP-6, scenario: "add chunk -> 201, server chunk_id, status ACTIVE, version 1, indexed with ES _id = chunk_id"}
    - {id: HP-7, scenario: "PATCH chunk status -> 200, status changed, version +1, updated_by/updated_at set"}
    - {id: HP-8, scenario: "empty PATCH body on directory or document -> 200, nothing changes, version not bumped"}
  auth_header:
    - {id: A1, scenario: "missing or non-UUID X-User-Id on any of the 6 APIs -> 401, service never called"}
  directory_rules:
    - {id: D1, scenario: "unknown parent_id on create or PATCH -> 404"}
    - {id: D2, scenario: "duplicate name under the same parent (case-insensitive) -> 409"}
    - {id: D3, scenario: "same name under different parents -> allowed"}
    - {id: D4, scenario: "duplicate root names (parent null) -> 409 (NULL parent must not bypass uniqueness)"}
    - {id: D5, scenario: "set parent_id to itself -> 422"}
    - {id: D6, scenario: "move a directory under its own descendant (cycle) -> 422"}
    - {id: D7, scenario: "PATCH parent_id null moves to root (null is meaningful); name/status null -> 422"}
    - {id: D8, scenario: "create or move under an INACTIVE parent -> 409"}
    - {id: D9, scenario: "PATCH unknown directory -> 404"}
    - {id: D10, scenario: "blank / whitespace-only / >128 char name -> 422; name is stripped"}
    - {id: D11, scenario: "unknown body field (e.g. created_by) -> 422"}
  document_rules:
    - {id: DO1, scenario: "unknown directory_id on create or PATCH -> 404"}
    - {id: DO2, scenario: "INACTIVE directory on create or move -> 409"}
    - {id: DO3, scenario: "provider outside aws/gcp -> 422; upload_status outside enum -> 422; status outside enum -> 422"}
    - {id: DO4, scenario: "negative size_in_bytes -> 422; zero allowed"}
    - {id: DO5, scenario: "blank name / document_type / file_type / content_type / chunking_strategy / embedding_model / bucket / storage_path -> 422"}
    - {id: DO6, scenario: "client cannot set upload_status, status, version, etag or raw_storage_url on create -> 422"}
    - {id: DO7, scenario: "PATCH of a field without a setter (version, provider, bucket, size_in_bytes, ...) -> 422"}
    - {id: DO8, scenario: "PATCH unknown document -> 404"}
    - {id: DO9, scenario: "PATCH null for a non-nullable field -> 422"}
    - {id: DO10, scenario: "same name in the same directory is allowed (no uniqueness required)"}
    - {id: DO11, scenario: "two PATCH calls -> version 3; each bump +1"}
  chunk_rules:
    - {id: C1, scenario: "unknown document_id -> 404"}
    - {id: C2, scenario: "INACTIVE document -> 409 on add chunk"}
    - {id: C3, scenario: "state outside chunking/media_captioning/contextualizing/work_item_creation/embedding -> 422; state_status outside in-progress/success/failure -> 422"}
    - {id: C4, scenario: "empty content -> 422; content_checksum blank -> 422; metadata must be an object"}
    - {id: C5, scenario: "PATCH chunk for unknown chunk_id -> 404"}
    - {id: C6, scenario: "PATCH chunk whose document_id differs from path document -> 404"}
    - {id: C7, scenario: "client cannot set chunk_id, version or changes on add -> 422 (changes starts empty)"}
    - {id: C8, scenario: "PATCH with fields other than status -> 422; status null -> 422"}
    - {id: C9, scenario: "ES unavailable on add/patch -> 503 search_unavailable, not 500"}
  storage_stubs:
    - {id: S1, scenario: "S3 and GCP provider classes exist behind a StorageProvider protocol; methods raise NotImplementedYetError (501); API never calls them"}
  integration:
    - {id: I1, scenario: "tables created at startup; self-FK, document FK and case-insensitive unique index enforced by Postgres"}
    - {id: I2, scenario: "end to end: directory tree -> document -> PATCH document -> add chunk -> PATCH chunk, read back from ES"}
    - {id: I3, scenario: "concurrent duplicate directory POST -> one 201, one 409, never 500"}
    - {id: I4, scenario: "ES mapping created with chunk fields; chunk _source contains version, changes [] and timestamps"}
  boundary_and_regression:
    - {id: B1, scenario: "retrieval imports no other business module"}
    - {id: B2, scenario: "onboarding and policy_engine behaviour unchanged"}
