  not_verified: integration tests (tests/integration/test_tracker.py) - Postgres unreachable (connection refused); I1-I3 unconfirmed
  decisions: list/create need X-User-Id, no policy_engine check (seam: service); webhook auth by HMAC-SHA256 hex in X-Signature, fail closed; stale-event guard via occurred_at + last_event_at; webhook updates written as SYSTEM_ACTOR (nil UUID); no tracker_default_provider setting (default in schema)
  notes: users verified via root EntityVerifier only when explicitly given; provider called before insert (orphan risk for real Jira, flagged for that phase)

design:
  feature: tracker tickets + provider interface + status webhook
  call_flow: |
    POST /v1/tickets -> TicketService -> TicketProvider.create_ticket -> TicketRepository -> Postgres
    POST /v1/tickets/webhooks/{provider} -> ProviderRegistry -> provider.parse_status_event (verify+decode) -> Ticket.apply_status_event -> commit
