  - [ ] test-integration run (docker was down)

review:
  verified: ruff, mypy --strict, 216 unit tests pass (existing tests unchanged except test_readiness, which gained the temporal check)
  not_verified: all 19 integration tests (docker down) - pgvector extension/column (I1), vector insert + unique chunk_id (I2/I3), real workflow + worker + activity log (I4/K1/K2/K3); I5 (plain postgres image error) has no test; compose temporalio/temporal:latest tag not pinned/verified
  notes:
    - Temporal SDK rejects lazy clients for workers: API client is lazy, worker connects eagerly (fails fast if Temporal is down)
    - SDK client has no close(); lifecycle = create once in lifespan, drop at shutdown
    - /health/ready now returns 503 when Temporal is down (gates readiness, per L4)
    - app/health.py imports from app.retrieval for the temporal client (global layer depends on retrieval, same as main.py)
    - existing local pgdata volume must be recreated when switching to the pgvector image
    - K2/K3 are covered only by the integration test (a Worker needs a live server)

design:
  feature: Temporal trigger + logging activity; ChunkVector add API
  responsibilities:
    api: HTTP mapping, actor header, 202 / 201
    core: WorkflowService starts the workflow (errors -> 503); ChunkVectorService checks document, embeds, validates length, owns commit
    temporal: client factory, workflow (deterministic), activity (logging), worker process
    repositories: ChunkVectorRepository select/insert only
  call_flow: |
    POST /v1/workflows/log -> WorkflowService -> Temporal -> worker -> LogWorkflow -> log_activity
    POST /v1/chunk-vectors -> ChunkVectorService -> EmbeddingProvider -> ChunkVectorRepository -> Postgres(pgvector)

